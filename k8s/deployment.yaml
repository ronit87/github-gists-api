apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-gists-api
  namespace: github-gists
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-gists-api
  template:
    metadata:
      labels:
        app: github-gists-api
    spec:
      imagePullSecrets:
        - name: dockerhub-creds
      containers:
        - name: github-gists-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: github-gists-api
  namespace: github-gists
spec:
  type: NodePort
  selector:
    app: github-gists-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
