
name: Python Gist API - Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: ronit87/github-gists-api
  AWS_REGION: ap-southeast-2
  EKS_CLUSTER_NAME: github-gists-eks
  K8S_NAMESPACE: github-gists
  DEPLOYMENT_NAME: github-gists-api
  CONTAINER_NAME: github-gists-api

jobs:
  build-test:
    name: Build and Test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Run Python lint and unit tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            python:3.13-slim \
            sh -c '
              set -e

              python -m venv /tmp/test-venv

              /tmp/test-venv/bin/pip install --no-cache-dir flake8

              if [ -f requirements.txt ]; then
                /tmp/test-venv/bin/pip install --no-cache-dir -r requirements.txt
              fi

              /tmp/test-venv/bin/flake8 . --count --select=E9,F63,F7,F82 --show-source

              /tmp/test-venv/bin/python -m unittest discover -s tests -v
            '

  deploy:
    name: Build and Deploy to EKS
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Update Docker Hub pull secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry dockerhub-creds \
            --namespace "$K8S_NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yaml

          kubectl set image \
            deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME"="${IMAGE_NAME}:${GITHUB_SHA}" \
            --namespace="$K8S_NAMESPACE"

          kubectl rollout status \
            deployment/"$DEPLOYMENT_NAME" \
            --namespace="$K8S_NAMESPACE" \
            --timeout=180s

      - name: Smoke test application
        shell: bash
        run: |
          set -euo pipefail

          kubectl port-forward \
            -n "$K8S_NAMESPACE" \
            service/"$DEPLOYMENT_NAME" \
            18080:80 > /tmp/port-forward.log 2>&1 &

          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS --max-time 5 http://127.0.0.1:18080/health; then
              echo "Application health check passed"
              exit 0
            fi

            sleep 2
          done

          echo "Application health check failed"
          cat /tmp/port-forward.log
          exit 1
